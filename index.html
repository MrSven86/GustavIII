<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gustav III – Föredrag</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #f0e8d8;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* TOP BAR */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
      gap: 12px;
    }
    #title-text {
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c9a96e;
      white-space: nowrap;
    }
    #counter {
      font-size: 0.85rem;
      color: #888;
      white-space: nowrap;
    }

    /* THUMBNAIL STRIP */
    #thumbstrip {
      display: flex;
      gap: 6px;
      padding: 6px 12px;
      background: #0e0e0e;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    #thumbstrip::-webkit-scrollbar { height: 4px; }
    #thumbstrip::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .thumb {
      width: 56px;
      height: 40px;
      object-fit: cover;
      border-radius: 3px;
      cursor: pointer;
      opacity: 0.45;
      border: 2px solid transparent;
      flex-shrink: 0;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .thumb:hover { opacity: 0.8; }
    .thumb.active { opacity: 1; border-color: #c9a96e; }

    /* MAIN STAGE */
    #stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 2px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.7);
    }

    /* ARROWS */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(201,169,110,0.3);
      color: #c9a96e;
      width: 52px;
      height: 72px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      z-index: 10;
    }
    .arrow:hover {
      background: rgba(201,169,110,0.18);
      border-color: #c9a96e;
    }
    #prev { left: 14px; }
    #next { right: 14px; }

    /* SLIDE NUMBER BADGE */
    #badge {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #c9a96e;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(201,169,110,0.25);
      pointer-events: none;
    }

    /* KEYBOARD HINT */
    #hint {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 0.7rem;
      color: #444;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="topbar">
  <span id="title-text">Gustav III – Föredrag</span>
  <span id="counter">1 / 16</span>
</div>

<div id="thumbstrip"></div>

<div id="stage">
  <button class="arrow" id="prev">&#8249;</button>
  <button class="arrow" id="next">&#8250;</button>
  <div id="badge">1 / 16</div>
  <div id="hint">← → piltangenter</div>
</div>

<script>
  const total = 16;
  const stage = document.getElementById('stage');
  const thumbstrip = document.getElementById('thumbstrip');
  const counter = document.getElementById('counter');
  const badge = document.getElementById('badge');
  let current = 0;

  // Build slides
  const slides = [];
  for (let i = 1; i <= total; i++) {
    const num = String(i).padStart(2, '0');
    const slide = document.createElement('div');
    slide.className = 'slide' + (i === 1 ? ' active' : '');
    const img = document.createElement('img');
    img.src = `images/img_${num}.jpg`;
    img.alt = `Bild ${i}`;
    slide.appendChild(img);
    stage.insertBefore(slide, document.getElementById('prev'));
    slides.push(slide);

    // Thumbnail
    const thumb = document.createElement('img');
    thumb.src = `images/img_${num}.jpg`;
    thumb.className = 'thumb' + (i === 1 ? ' active' : '');
    thumb.alt = `Bild ${i}`;
    thumb.addEventListener('click', () => goTo(i - 1));
    thumbstrip.appendChild(thumb);
  }

  const thumbs = thumbstrip.querySelectorAll('.thumb');

  function goTo(idx) {
    slides[current].classList.remove('active');
    thumbs[current].classList.remove('active');
    current = (idx + total) % total;
    slides[current].classList.add('active');
    thumbs[current].classList.add('active');
    thumbs[current].scrollIntoView({ inline: 'center', behavior: 'smooth' });
    const label = `${current + 1} / ${total}`;
    counter.textContent = label;
    badge.textContent = label;
  }

  document.getElementById('prev').addEventListener('click', () => goTo(current - 1));
  document.getElementById('next').addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1);
  });

  // Swipe support
  let touchStartX = 0;
  stage.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) goTo(current + (dx < 0 ? 1 : -1));
  });
</script>
</body>
</html>
